title = "prep gitleaks config"

# Inherit gitleaks' default ruleset.
[extend]
useDefault = true

[allowlist]
description = "Paths and placeholder values with no real credential surface."
paths = [
  '''(?i)\.lock$''',
  '''uv\.lock''',
  '''examples/.*\.json''',
  '''scrape/.*/raw/.*''',
  '''algo_push/.*''',
]
regexes = [
  '''(?i)example|placeholder|your-token-here|xxxx''',
]
