[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prep-scraper-kit"
version = "0.1.0"
description = "Scraper contract + validation + Notion upload kit for interview-question content."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Harry Dai" }]
keywords = ["notion", "scraper", "interview", "leetcode"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["requests>=2.31"]

[project.urls]
Homepage = "https://github.com/harrydaihaolin/prep"
Repository = "https://github.com/harrydaihaolin/prep"

[project.scripts]
prep-validate = "scripts.validate_chunks:main"
prep-upload = "scripts.upload_to_notion:main"

[tool.setuptools]
py-modules = []
packages = []
script-files = [
    "scripts/validate_chunks.py",
    "scripts/upload_to_notion.py",
]
